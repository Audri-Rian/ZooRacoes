spring.application.name=ZooRacoesApi

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/zooracoes}
spring.datasource.username=${DATABASE_USERNAME:zooracoes}
spring.datasource.password=${DATABASE_PASSWORD:zooracoes_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

zooracoes.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
