# Smoke tests: H2 in-memory — não depende de Postgres/Docker local (pre-push).
spring.datasource.url=jdbc:h2:mem:zooracoes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info
zooracoes.cors.allowed-origins=http://localhost:3000
