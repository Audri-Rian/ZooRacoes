services:
  postgres:
    image: postgres:16-alpine
    container_name: zooracoes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zooracoes}
      POSTGRES_USER: ${POSTGRES_USER:-zooracoes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zooracoes_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zooracoes} -d ${POSTGRES_DB:-zooracoes}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zooracoes

volumes:
  postgres_data:

networks:
  zooracoes:
    name: zooracoes-net
